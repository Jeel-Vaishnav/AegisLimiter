syntax = "proto3";

package ratelimiter.v1;

option go_package = "github.com/distributed-systems/rate-limiter/pkg/grpc/pb;ratelimiter_pb";

// RateLimiterService defines the gRPC interface for high-throughput rate limiting
service RateLimiterService {
  // CheckRateLimit evaluates whether an incoming request should be allowed or rejected
  rpc CheckRateLimit (RateLimitRequest) returns (RateLimitResponse);

  // GetStatus retrieves the current quota status for a given key without consuming tokens
  rpc GetStatus (StatusRequest) returns (StatusResponse);

  // ResetLimit resets the quota and timestamps for a specific rate limit key
  rpc ResetLimit (ResetRequest) returns (ResetResponse);

  // ConfigureRule dynamically configures or updates rate limit rules for client tiers
  rpc ConfigureRule (ConfigureRuleRequest) returns (ConfigureRuleResponse);
}

enum AlgorithmType {
  ALGORITHM_UNSPECIFIED = 0;
  TOKEN_BUCKET = 1;
  SLIDING_WINDOW_COUNTER = 2;
  SLIDING_WINDOW_LOG = 3;
  LEAKY_BUCKET = 4;
}

message RateLimitRequest {
  // Unique identifier for the client, IP, API key, or route (e.g. "api_key:tier1_abc123")
  string key = 1;

  // Rate limiting algorithm to apply
  AlgorithmType algorithm = 2;

  // Weight / cost of the request (defaults to 1)
  int64 cost = 3;

  // Optional: override capacity for this request
  int64 capacity = 4;

  // Optional: override refill rate (tokens/sec) or window size
  double rate_per_second = 5;

  // Optional: window duration in milliseconds (for sliding window algorithms)
  int64 window_size_ms = 6;
}

message RateLimitResponse {
  // Whether the request is permitted
  bool allowed = 1;

  // Remaining tokens/requests allowed in current window
  int64 remaining = 2;

  // Configured maximum limit or capacity
  int64 limit = 3;

  // Milliseconds to wait before retrying (0 if allowed)
  int64 retry_after_ms = 4;

  // Milliseconds until the rate limit bucket resets or fully replenishes
  int64 reset_ms = 5;

  // Algorithm that made the decision
  AlgorithmType algorithm = 6;

  // Cache tier that resolved this check ("L1_MEMORY" or "L2_REDIS")
  string cache_tier = 7;
}

message StatusRequest {
  string key = 1;
  AlgorithmType algorithm = 2;
}

message StatusResponse {
  string key = 1;
  AlgorithmType algorithm = 2;
  int64 remaining = 3;
  int64 limit = 4;
  int64 reset_ms = 5;
}

message ResetRequest {
  string key = 1;
  AlgorithmType algorithm = 2;
}

message ResetResponse {
  bool success = 1;
  string message = 2;
}

message ConfigureRuleRequest {
  string client_tier = 1;       // e.g., "free", "pro", "enterprise"
  AlgorithmType algorithm = 2;
  int64 capacity = 3;
  double rate_per_second = 4;
  int64 window_size_ms = 5;
}

message ConfigureRuleResponse {
  bool success = 1;
  string message = 2;
}
