name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  gorelease:
    name: Build Multi-Arch Binaries & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Compile Multi-Platform Binaries
        run: |
          mkdir -p dist
          # Linux AMD64
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-w -s -X main.version=${{ github.ref_name }}" -o dist/aegislimiter-linux-amd64 cmd/server/main.go
          # Linux ARM64
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-w -s -X main.version=${{ github.ref_name }}" -o dist/aegislimiter-linux-arm64 cmd/server/main.go
          # Darwin (macOS) AMD64 & ARM64
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-w -s -X main.version=${{ github.ref_name }}" -o dist/aegislimiter-darwin-amd64 cmd/server/main.go
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-w -s -X main.version=${{ github.ref_name }}" -o dist/aegislimiter-darwin-arm64 cmd/server/main.go
          # Windows AMD64
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-w -s -X main.version=${{ github.ref_name }}" -o dist/aegislimiter-windows-amd64.exe cmd/server/main.go

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: AegisLimiter ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*
